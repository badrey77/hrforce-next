name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Superseded PR runs are cancelled; every main commit is checked.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  NPM_VERSION: 11.20.0 # keep in sync with package.json "packageManager"

jobs:
  lint:
    name: Lint (oxlint)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install -g npm@${{ env.NPM_VERSION }}
      - run: npm ci
      - run: npm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install -g npm@${{ env.NPM_VERSION }}
      - run: npm ci
      - run: npm run typecheck # api + web + tools/

  test-api:
    name: Test API (Postgres 18)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # The e2e harness creates a throwaway database per test file on this cluster (no Testcontainers in CI).
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      TEST_MIGRATOR_PASSWORD: ci_migrator_pw
      TEST_APP_PASSWORD: ci_app_pw
      TEST_WORKER_PASSWORD: ci_worker_pw
      MIGRATOR_DATABASE_URL: postgres://hrforce_migrator:ci_migrator_pw@localhost:5432/hrforce
      LOG_LEVEL: warn
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install -g npm@${{ env.NPM_VERSION }}
      - run: npm ci
      - name: Create roles and database (apps/api/scripts/create-roles.sql)
        run: >-
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1
          -v migrator_password="'ci_migrator_pw'" -v app_password="'ci_app_pw'" -v worker_password="'ci_worker_pw'" -v db=hrforce
          -f apps/api/scripts/create-roles.sql
      - name: Run migrations (twice — the second run must be a no-op)
        run: |
          npm run migrate -w @hrforce/api
          npm run migrate -w @hrforce/api
      - run: npm test -w @hrforce/api

  test-web:
    name: Test web (+ SSO demo app)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install -g npm@${{ env.NPM_VERSION }}
      - run: npm ci
      - run: npm test -w @hrforce/web
      - name: Test the SSO demo app (apps/sso-demo, no database needed)
        run: npm test -w @hrforce/sso-demo

  build:
    name: Build (api + web + API image)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install -g npm@${{ env.NPM_VERSION }}
      - run: npm ci
      - run: npm run build
      - uses: docker/setup-buildx-action@v3
      - name: Build API image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          tags: hrforce-api:ci
          cache-from: type=gha,scope=api-image
          cache-to: type=gha,mode=max,scope=api-image

  guardrails:
    name: Guardrails (static + DB)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      # migrations guard: on a push, compare with the previous tip of the branch; on a PR it uses
      # `git merge-base HEAD origin/main` (hence fetch-depth: 0). An all-zero SHA (new branch) is ignored.
      GUARD_MIGRATIONS_BASE: ${{ github.event_name == 'push' && github.event.before || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install -g npm@${{ env.NPM_VERSION }}
      - run: npm ci
      - name: Guardrail unit tests (fixtures; DB cases use the service)
        run: npm run test:tools
      - name: Static guardrails (boundaries, route-scan, migrations, no-secrets, i18n, css-logical)
        run: npm run guard
      - name: Route → permission table
        run: npm run --silent guard:route-scan -- --json > route-permissions.json
      - name: DB guardrails (company-id, audit-per-write, schema-drift) on a freshly migrated database
        run: npm run guard:db
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: route-permissions
          path: route-permissions.json
          if-no-files-found: ignore
