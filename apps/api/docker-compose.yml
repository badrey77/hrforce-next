# Local development stack. Usage (from apps/api):
#   docker compose up -d                 → postgres + mailpit (SMTP on :1025, web UI on http://localhost:8025)
#   docker compose --profile api up -d   → + the API and worker containers (built from apps/api/Dockerfile)
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
      HRFORCE_MIGRATOR_PASSWORD: hrforce_migrator_dev
      HRFORCE_APP_PASSWORD: hrforce_app_dev
      # the background worker's role (npm run worker; added by migration 0012). An existing volume created before
      # it: scripts/dev-up.sh|ps1 create the role, or run create-roles.sql again (README › Roles).
      HRFORCE_WORKER_PASSWORD: hrforce_worker_dev
      HRFORCE_DB: hrforce
    ports:
      - "5432:5432"
    volumes:
      - ./scripts/create-roles.sql:/hrforce/create-roles.sql:ro
      - ./scripts/docker-init-roles.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
      - hrforce-pg:/var/lib/postgresql

  # Captures every outgoing mail (password setup / reset links). Nothing is delivered to real mailboxes.
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025" # SMTP  (SMTP_URL=smtp://localhost:1025 for an API running on the host)
      - "8025:8025" # web UI

  api:
    profiles: ["api"]
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    depends_on: [postgres, mailpit]
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://hrforce_app:hrforce_app_dev@postgres:5432/hrforce
      MIGRATOR_DATABASE_URL: postgres://hrforce_migrator:hrforce_migrator_dev@postgres:5432/hrforce
      COOKIE_SECRET: dev-cookie-secret-dev-cookie-secret-0001
      AUTH_ACCESS_SECRET: dev-access-secret-dev-access-secret-0001
      AUTH_XSRF_SECRET: dev-xsrf-secret-dev-xsrf-secret-00000001
      # AUTH_MFA_KEY unset: the public development key (insecure; development only)
      COOKIE_SECURE: "false"
      WEB_BASE_URL: http://localhost:4200
      MAIL_TRANSPORT: smtp
      SMTP_URL: smtp://mailpit:1025
      MAIL_FROM: HRForce <no-reply@hrforce.local>
      DEV_PERMISSIONS: allow_all

  # Background jobs (Graphile Worker): notification e-mails, monthly/daily cron. Same image, other entry point.
  worker:
    profiles: ["api"]
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    depends_on: [postgres, mailpit]
    command: ["node", "dist/worker.js"]
    healthcheck:
      test: ["CMD", "node", "dist/worker-health.js"]
      interval: 30s
      timeout: 5s
      retries: 3
    environment:
      NODE_ENV: development
      WORKER_DATABASE_URL: postgres://hrforce_worker:hrforce_worker_dev@postgres:5432/hrforce
      WORKER_CONCURRENCY: "4"
      WEB_BASE_URL: http://localhost:4200
      MAIL_TRANSPORT: smtp
      SMTP_URL: smtp://mailpit:1025
      MAIL_FROM: HRForce <no-reply@hrforce.local>

volumes:
  hrforce-pg:
