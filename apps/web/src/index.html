<!doctype html>
<html lang="fr" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <title>HRForce</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      No Referer on any request. /password/setup?token=… carries a live single-use token in its URL; with the
      browser default (full URL to the same origin) every /api call made from that page would hand the token to
      the API's access log and to any proxy in between.
    -->
    <meta name="referrer" content="no-referrer" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <!--
      Installable web app (docs/contracts/attendance.md › Web › PWA): employees add HRForce to their phone's home
      screen and the entrance QR code opens it. The manifest alone makes current Android Chrome offer "Install"; there
      is deliberately NO service worker (nothing authenticated is cached on shared or lost phones, no stale release).
      `manifest-src 'self'` is already in the CSP. The theme colour tints the phone's status bar.
    -->
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#1f4e79" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <!--
      Applies the language stored on this device to <html lang dir> before the body is styled, so an Arabic
      session starts right-to-left and never fetches the Latin font it does not use (public/lang-boot.js explains).
      A file, not an inline script: the CSP is script-src 'self'. Classic (blocking) on purpose: it must run first.
    -->
    <script src="lang-boot.js"></script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
