# Local development database. Usage (from apps/api): docker compose up -d
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
      HRFORCE_MIGRATOR_PASSWORD: hrforce_migrator_dev
      HRFORCE_APP_PASSWORD: hrforce_app_dev
      HRFORCE_DB: hrforce
    ports:
      - "5432:5432"
    volumes:
      - ./scripts/create-roles.sql:/hrforce/create-roles.sql:ro
      - ./scripts/docker-init-roles.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
      - hrforce-pg:/var/lib/postgresql
volumes:
  hrforce-pg:
